name: Update README

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - README.md
      - preview/**
      - .github/scripts/**
      - .github/workflows/update-readme.yml

permissions:
  contents: read

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Verify refresh adapter
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify recorded animation and native Markdown
        run: |
          set -o pipefail
          PROFILE_BROWSER_TESTS=1 nix-shell preview --run 'python3 -m unittest discover -s preview -p "test_*.py" -v' 2>&1 | tee "$RUNNER_TEMP/profile-verification.log"
      - name: Report verification failure
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "profile-verification.log"
          if log.exists():
              text = log.read_text()[-12000:]
              for start in range(0, len(text), 2000):
                  message = text[start:start + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Profile verification failed::{message}")
          PYTHON

  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483
        with:
          card: top-langs
          options: username=Castrozan&layout=compact&langs_count=6&hide=HTML,CSS,Dockerfile,Makefile
          path: ${{ runner.temp }}/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.2.1"
          fail_on_error: "true"

      - name: Fetch PRs in external repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (
            gh api graphql --paginate -f query='
              query($endCursor: String) {
                search(query: "author:Castrozan is:pr is:merged -user:Castrozan", type: ISSUE, first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { ... on PullRequest { title number url repository { nameWithOwner url stargazerCount } } }
                }
              }
            ' --jq '.data.search.nodes[]'
            gh api graphql --paginate -f query='
              query($endCursor: String) {
                search(query: "author:Castrozan is:pr is:open -user:Castrozan", type: ISSUE, first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { ... on PullRequest { title number url repository { nameWithOwner url stargazerCount } } }
                }
              }
            ' --jq '.data.search.nodes[]'
          ) | jq -s '
            [.[] | select(.repository.stargazerCount >= 50)]
            | group_by(.repository.nameWithOwner)
            | map({
                repo: .[0].repository.nameWithOwner,
                repo_url: .[0].repository.url,
                stars: .[0].repository.stargazerCount,
                prs: [.[] | {number, title, url}]
              })
            | sort_by(-.stars)
          ' > "$RUNNER_TEMP/contributions.json"

      - name: Verify refresh adapter
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Refresh native Markdown and calendar assets
        run: python3 .github/scripts/refresh_profile.py "$RUNNER_TEMP/languages.svg" "$RUNNER_TEMP/contributions.json"
      - name: Publish native source before recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- preview/scene/front.md preview/scene/assets; then
            git add preview/scene/front.md preview/scene/assets/gitlab-calendar-light.svg preview/scene/assets/gitlab-calendar-dark.svg
            git commit -m "docs: refresh native profile sources"
            git push origin HEAD:master
          fi
      - name: Record both GitHub themes
        run: |
          nix-shell preview --run 'python3 preview/record.py --theme light'
          nix-shell preview --run 'python3 preview/record.py --theme dark'
      - name: Verify recorded animation and native Markdown
        run: |
          set -o pipefail
          PROFILE_BROWSER_TESTS=1 nix-shell preview --run 'python3 -m unittest discover -s preview -p "test_*.py" -v' 2>&1 | tee "$RUNNER_TEMP/profile-verification.log"
      - name: Report verification failure
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "profile-verification.log"
          if log.exists():
              text = log.read_text()[-12000:]
              for start in range(0, len(text), 2000):
                  message = text[start:start + 2000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Profile verification failed::{message}")
          PYTHON
      - name: Publish refreshed GIFs
        run: |
          if ! git diff --quiet -- preview/readme-flip-light.gif preview/readme-flip-dark.gif; then
            git add preview/readme-flip-light.gif preview/readme-flip-dark.gif
            git commit -m "docs: refresh animated profile recording"
            git push origin HEAD:master
          fi
